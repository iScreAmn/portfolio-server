# Бэкенд: api.djcode.ge

server {
    listen 80;
    listen [::]:80;
    server_name api.djcode.ge;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://api.djcode.ge$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.djcode.ge;

    ssl_certificate     /etc/letsencrypt/live/api.djcode.ge/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.djcode.ge/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 1m;

    location / {
        proxy_pass http://api:5050;
        proxy_http_version 1.1;

        # X-Forwarded-For обязателен: по нему Express (trust proxy 1) считает
        # rate-limit и определяет страну посетителя.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 30s;
    }
}
