# Лежит на сервере в /opt/portfolio/docker-compose.yml рядом с .env.
#
# Ничего не собирается на месте: все образы приезжают готовыми из GHCR,
# сборкой занимается GitHub Actions.

name: portfolio

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Портов наружу нет специально: база доступна только внутри сети
    # internal. Для psql с хоста — `docker compose exec db psql ...`.
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    image: ghcr.io/iscreamn/react-portfolio-server:latest
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 5050
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    # Наружу не публикуется: до api ходит только nginx внутри сети.
    expose:
      - '5050'

  web:
    image: ghcr.io/iscreamn/react-portfolio:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    networks:
      - internal
    expose:
      - '3000'

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    # Единственный сервис с портами наружу.
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # Сертификаты выпускает certbot на самом хосте.
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Сюда certbot кладёт файлы для http-01 проверки при продлении.
      - ./certbot-www:/var/www/certbot:ro
    depends_on:
      - web
      - api
    networks:
      - internal

volumes:
  pgdata:

networks:
  internal:
    driver: bridge
